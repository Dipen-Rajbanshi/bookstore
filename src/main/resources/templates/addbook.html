<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Book</title>
</head>
<body>

<h1>Add a new book</h1>

<form th:action="@{/addbook}" th:object="${book}" method="post">
    <input type="hidden" th:field="*{id}" />
    <label>Title: <input type="text" th:field="*{title}" /></label><br/>
    <label>Author: <input type="text" th:field="*{author}" /></label><br/>
    <label>Year: <input type="number" th:field="*{publicationYear}" /></label><br/>
    <label>ISBN: <input type="text" th:field="*{isbn}" /></label><br/>
    <label>Price: <input type="number" step="0.01" th:field="*{price}" /></label><br/>
    <label>Category:
        <select th:field="*{category}">
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}">
            </option>
        </select>
    </label>
    <br/>
    <button type="submit">Add Book</button>  
</form>

</body>
</html>
